repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: python3 -m unittest tests/test_harmonization_suite.py tests/test_core_coverage.py tests/test_ai_service_harness.py
        language: system
        pass_filenames: false
        always_run: true
