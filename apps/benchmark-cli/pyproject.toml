[project]
name = "benchmark-cli"
version = "0.1.0"
description = "Empirical verification, progressive NASA FIRMS data fetcher, and publication figure generator for Flare-Chronos"
authors = [{name = "Xiro The Dev", email = "lethanhtrung.trungle@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "flare-chronos-core",
    "firms-ingestion",
]

[tool.uv.sources]
flare-chronos-core = { workspace = true }
firms-ingestion = { workspace = true }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
