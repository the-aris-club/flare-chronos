[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flare-chronos-ai-service"
version = "0.1.0"
description = "Dual-System LangGraph reasoning harness with a Deterministic Tool Gate, grounded narratives and human sign-off for Flare-Chronos"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt>=2.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]
