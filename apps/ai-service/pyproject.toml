[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flare-chronos-ai-service"
version = "1.0.0"
description = "Dual-System (System 1 jev + System 2 qwen3.8-flash-next) LangGraph Reasoning Harness with Deterministic Tool Gate for Flare-Chronos"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]
