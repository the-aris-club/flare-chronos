[project]
name = "firms-ingestion"
version = "1.0.0"
description = "NASA LANCE FIRMS API and Archive ingestion adapter with rate-limit pacing and local cache"
authors = [{name = "Xiro The Dev", email = "lethanhtrung.trungle@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "flare-chronos-core",
]

[tool.uv.sources]
flare-chronos-core = { workspace = true }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
