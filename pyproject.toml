[project]
name = "flare-chronos-workspace"
version = "0.1.0"
description = "Cross-Sensor Harmonization of MODIS (C6.1) and VIIRS (375m C1/C2) Active Fire Hot Spots & 26-Year Harmonized Burning Activity Calendar"
readme = "docs/01_NASA_SpaceApps_Proposal.md"
authors = [{name = "Xiro The Dev", email = "lethanhtrung.trungle@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
]

[tool.uv.workspace]
members = [
    "packages/harmonization-core",
    "packages/firms-ingestion",
    "apps/benchmark-cli",
    "apps/ai-service",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.0",
    "pyright>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt>=2.8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = [
    "packages/harmonization-core/src",
    "packages/firms-ingestion/src",
    "apps/benchmark-cli/src",
    "apps/ai-service/src",
    "src",
]
testpaths = ["tests"]
addopts = ["-m", "not live"]
markers = [
    "live: calls a real hosted language model and spends provider credit; excluded from the default suite",
]

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S310"]
"exports/export_pdf.py" = ["S603"]

[tool.pyright]
extraPaths = [
    "packages/harmonization-core/src",
    "packages/firms-ingestion/src",
    "apps/benchmark-cli/src",
    "apps/ai-service/src",
    "src",
]
